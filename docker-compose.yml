services:
  krakarr:
    image: krakarr:latest
    build: .
    container_name: krakarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      # Optional: serve under a sub path behind a reverse proxy, e.g. /krakarr
      # KRAKARR__URLBASE: "/krakarr"
      # Optional: use PostgreSQL instead of the default SQLite database in /config
      # Database__Provider: "postgres"
      # Database__ConnectionString: "Host=postgres;Database=krakarr;Username=krakarr;Password=krakarr"
    ports:
      - "8787:8787"        # Web UI + API
      - "6881:6881"        # BitTorrent (TCP)
      - "6881:6881/udp"    # BitTorrent (uTP / DHT)
    volumes:
      - ./config:/config
      # One mount for downloads AND the library so imports can hardlink instead of copy.
      # Inside the container: /data/downloads (torrents) and e.g. /data/media/movies (root folder).
      - /path/to/data:/data

