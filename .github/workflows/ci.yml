name: CI

# Runs on pull requests, and as the first stage of the Release workflow for pushes to main
# (so main is not built twice).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release scripts
        run: node --test scripts/release/*.test.mjs
      - name: Lint commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            echo "No commit range to lint (manual run or new branch)"; exit 0
          fi
          node scripts/release/lint-commits.mjs --range "$range"

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the whole git history (not just the working tree), so a secret that was committed
      # and later deleted still fails the build. Uses Betterleaks' built-in rules (stable v1 line;
      # v2 is still in release candidates) plus the false-positive filter in .betterleaks.toml.
      - name: Betterleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/betterleaks/betterleaks:v1.10.1 \
            git --config .betterleaks.toml --redact -v .
      # Guards the config: a fake GitHub token generated at runtime must still be caught, so the
      # filter can't silently drop the built-in rules.
      - name: Check the config still detects secrets
        run: |
          mkdir -p "$RUNNER_TEMP/canary"
          token="ghp_$(head -c 512 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          echo "GITHUB_TOKEN=$token" > "$RUNNER_TEMP/canary/env.txt"
          if docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/canary:/scan:ro" ghcr.io/betterleaks/betterleaks:v1.10.1 \
               dir --config /repo/.betterleaks.toml --redact /scan; then
            echo "::error::Betterleaks did not flag the canary token; check .betterleaks.toml"; exit 1
          fi

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Krakarr.slnx -c Release -p:SkipWebBuild=true
      - name: Test
        run: dotnet test --solution Krakarr.slnx -c Release --no-build -p:SkipWebBuild=true

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build
      - run: npx ng test --watch=false

  docker:
    name: Docker image (build only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=0.0.0-pr.${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
